apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webhook
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-webhook
spec:
  selector:
    app: {{ .Release.Name }}-webhook
  ports:
    - name: http
      port: 8000
      targetPort: 8000
