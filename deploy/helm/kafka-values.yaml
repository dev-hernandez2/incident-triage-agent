# Bitnami Kafka, KRaft mode, single broker — no Zookeeper, no replication
# beyond what one broker provides. Sized for a local kind cluster demo.
#
# image.repository pinned to bitnamilegacy (a free mirror of the last
# published tags) because docker.io/bitnami/kafka no longer serves
# versioned tags for free — Bitnami moved those behind a paid "Secure
# Images" subscription in 2025. bitnamilegacy/kafka:4.0.0-debian-12-r10
# is the same image the chart's default bitnami/kafka tag pointed to.
image:
  registry: docker.io
  repository: bitnamilegacy/kafka

controller:
  replicaCount: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  persistence:
    size: 2Gi

broker:
  replicaCount: 0

listeners:
  client:
    protocol: PLAINTEXT

kraft:
  enabled: true
