apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-executor
  namespace: triage
  labels:
    app: triage-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-executor
  template:
    metadata:
      labels:
        app: triage-executor
    spec:
      serviceAccountName: triage-executor
      containers:
        - name: executor
          image: triage-executor:latest
          envFrom:
            - secretRef:
                name: triage-secrets
