# Exposes the agent Deployment's metrics port as a Service, so the
# ServiceMonitor in grafana-dashboard-agent.yaml (which discovers
# Kubernetes Services/Endpoints, not Deployments/pods directly) has
# something to select and scrape.
apiVersion: v1
kind: Service
metadata:
  name: triage-agent
  namespace: triage
  labels:
    app: triage-agent
spec:
  selector:
    app: triage-agent
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
