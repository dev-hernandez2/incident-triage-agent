# The triage-agent-grafana-dashboard ConfigMap is NOT defined here. It is
# created/updated from the real dashboard JSON (deploy/monitoring/
# grafana-agent-dashboard.json) via the kubectl create configmap
# --from-file workflow documented in deploy/k8s/README.md. Defining it a
# second time in this file would create two sources of truth for the same
# ConfigMap name, and whichever is applied last would silently win.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: triage-agent
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: triage-agent
  namespaceSelector:
    matchNames:
      - triage
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
