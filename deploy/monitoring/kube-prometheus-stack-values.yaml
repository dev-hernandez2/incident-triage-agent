# kube-prometheus-stack chart values trimmed for a laptop kind cluster.
# No persistence (emptyDir) since the cluster is ephemeral and torn down with
# `make down`. Resource requests kept small; disable components that don't
# apply to kind (no real etcd/scheduler/controller-manager metrics endpoints).

grafana:
  adminPassword: admin
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
  persistence:
    enabled: false
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    storageSpec: {}
    walCompression: true

alertmanager:
  config:
    global: {}
    route:
      receiver: webhook
      group_by: ["alertname"]
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
    receivers:
      - name: webhook
        webhook_configs:
          - url: "http://host.docker.internal:8000/alerts"
            send_resolved: true
  alertmanagerSpec:
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    storage: {}

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 150m, memory: 128Mi}

kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

kubeStateMetrics:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}

nodeExporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
