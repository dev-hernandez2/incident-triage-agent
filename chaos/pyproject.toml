[project]
name = "triage-chaos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "kubernetes>=30.1",
    "pyyaml>=6.0",
    "GitPython>=3.1",
    "httpx>=0.27",
]

[project.scripts]
chaos = "chaos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaos"]
