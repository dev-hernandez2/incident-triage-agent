[project]
name = "triage-webhook"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "confluent-kafka>=2.5",
    "triage-obs",
]

[tool.uv.sources]
triage-obs = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook"]
