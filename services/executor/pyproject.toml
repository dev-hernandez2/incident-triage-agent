[project]
name = "triage-executor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kubernetes>=31.0",
    "httpx>=0.27",
    "triage-db",
]

[tool.uv.sources]
triage-db = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/executor"]
